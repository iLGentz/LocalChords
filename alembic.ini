# Configurazione Alembic per l'uso da riga di comando in sviluppo:
#   uv run alembic revision --autogenerate -m "descrizione"
#   uv run alembic upgrade head
# L'URL del database viene da app/config.py (LOCALCHORDS_DATA_DIR) se non indicato qui.
# L'app applica le migrazioni da sola all'avvio.

[alembic]
script_location = %(here)s/app/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
