[project]
name = "localchords"
version = "0.1.0"
description = "App desktop local-first per Windows: accordi, testi sincronizzati, tab e stem da un file audio."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pywebview>=6.2",
    "librosa>=0.11",
    "soundfile>=0.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "faster-whisper>=1.2",
]

[project.optional-dependencies]
# Adapter YouTube, disattivato di default (setup.ps1 -YouTube). L'extra "deno" installa il
# runtime JavaScript che yt-dlp richiede per YouTube.
youtube = ["yt-dlp[default,deno]>=2026.11.23"]
# Runtime di separazione: uno solo dei due (setup.ps1 sceglie in base alla GPU).
# audioread: usato da audio-separator, non pi?? installato da librosa 1.0.
cpu = ["audio-separator[cpu]>=0.48", "torch>=2.14,<2.15", "audioread>=3.0"]
nvidia = ["audio-separator[gpu]>=0.48", "torch>=2.14,<2.15", "audioread>=3.0"]

[project.scripts]
localchords = "app.desktop:main"
localchords-api = "app.api.server:main"
localchords-worker = "app.worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",
    "mypy>=2.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Python solo dalla cartella dell'app (vedi setup.ps1), mai quello di sistema.
python-preference = "only-managed"
conflicts = [[{ extra = "cpu" }, { extra = "nvidia" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "nvidia" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["webview", "webview.*", "yt_dlp", "yt_dlp.*", "soundfile", "librosa", "librosa.*", "audio_separator", "audio_separator.*", "onnxruntime", "torch", "torch.*", "faster_whisper", "faster_whisper.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

